openapi: 3.0.3
info:
  title: Assentia
  version: 0.1.0
  description: >-
    Deployment-warrant system for public-sector AI. Public bodies publish challenges
    before tender, register ai-assisted decision services against a consequence grade,
    assemble a disclosable evidence pack, value any public data they supply, and receive
    a named, time-boxed, revocable warrant to operate. Every decision writes an
    explanation artefact that a citizen can retrieve and contest.
  x-product-slug: ai-gov-assentia
  x-source: ai-in-gov/ai-in-the-UK-ReadyWillingAndAble-April-2018/
servers:
  - url: https://api.example.com
tags:
  - name: Challenges
    description: Open pre-tender board of public-sector problems open to ai-based solutions
  - name: Procurement
    description: Tender lots, awards, and SME participation accounting
  - name: Assurance
    description: Service registration, consequence grading, evidence packs, intelligibility
  - name: Warrants
    description: Deployment warrant issue, renewal, revalidation, and suspension
  - name: DataSupply
    description: Public data supply agreements, valuations, and external review
  - name: Decisions
    description: Decision records and citizen-retrievable explanation artefacts
  - name: Redress
    description: Citizen challenge intake, adjudication, and overturn recording
  - name: Portfolio
    description: Speculative and prototype investment governance
  - name: Reporting
    description: SME access reporting, oversight workload, and the annual return
paths:
  /v1/challenges:
    get:
      operationId: listPublicChallenges
      tags: [Challenges]
      summary: List published public-sector challenges
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: buyingBodyId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, in_procurement, awarded, withdrawn]
      responses:
        "200":
          description: Challenges page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePublicChallenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: publishPublicChallenge
      tags: [Challenges]
      summary: Publish a challenge to the open board before tender
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicChallengeCreate"
      responses:
        "201":
          description: Challenge published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePublicChallenge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/challenges/{challengeId}:
    parameters:
      - $ref: "#/components/parameters/ChallengeId"
    get:
      operationId: getPublicChallenge
      tags: [Challenges]
      summary: Retrieve a published challenge
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePublicChallenge"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tender-lots:
    get:
      operationId: listTenderLots
      tags: [Procurement]
      summary: List tender lots with participation counts
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: challengeId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tender lots page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTenderLot"
    post:
      operationId: createTenderLot
      tags: [Procurement]
      summary: Open a tender lot against a published challenge
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenderLotCreate"
      responses:
        "201":
          description: Lot opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTenderLot"
        "409":
          description: Challenge not published, so the lot cannot open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/tender-lots/{lotId}/award:
    parameters:
      - $ref: "#/components/parameters/LotId"
    post:
      operationId: recordLotAward
      tags: [Procurement]
      summary: Record the award of a lot to a supplier
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotAwardCreate"
      responses:
        "201":
          description: Award recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLotAward"
        "409":
          description: Award blocked because a required data valuation is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/services:
    get:
      operationId: listAiServices
      tags: [Assurance]
      summary: List registered ai-assisted decision services
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: consequenceGrade
          in: query
          schema:
            $ref: "#/components/schemas/ConsequenceGrade"
        - name: operatingStatus
          in: query
          schema:
            type: string
            enum: [registered, assured, live, suspended, retired]
      responses:
        "200":
          description: Services page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAiService"
    post:
      operationId: registerAiService
      tags: [Assurance]
      summary: Register a service and set its consequence grade
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiServiceCreate"
      responses:
        "201":
          description: Service registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAiService"
  /v1/services/{serviceId}/evidence-packs:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    post:
      operationId: submitEvidencePack
      tags: [Assurance]
      summary: Submit a versioned evidence pack for a service
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidencePackCreate"
      responses:
        "201":
          description: Evidence pack version accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEvidencePack"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/services/{serviceId}/intelligibility-assessments:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    post:
      operationId: assessIntelligibility
      tags: [Assurance]
      summary: Record an intelligibility assessment against the grade standard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligibilityAssessmentCreate"
      responses:
        "201":
          description: Assessment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeIntelligibilityAssessment"
  /v1/services/{serviceId}/code-conformance:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    put:
      operationId: setCodeConformance
      tags: [Assurance]
      summary: Set or update the ethical code seal status for a service
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeConformance"
      responses:
        "200":
          description: Conformance updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCodeConformance"
  /v1/warrants:
    get:
      operationId: listDeploymentWarrants
      tags: [Warrants]
      summary: List deployment warrants
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [issued, expiring, expired, suspended, revalidation_required, withdrawn]
      responses:
        "200":
          description: Warrants page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDeploymentWarrant"
    post:
      operationId: issueDeploymentWarrant
      tags: [Warrants]
      summary: Issue a named, time-boxed warrant to operate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantIssueRequest"
      responses:
        "201":
          description: Warrant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeploymentWarrant"
        "409":
          description: Warrant refused because the service cannot meet its explanation standard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/warrants/{warrantId}:
    parameters:
      - $ref: "#/components/parameters/WarrantId"
    get:
      operationId: getDeploymentWarrant
      tags: [Warrants]
      summary: Retrieve a warrant with its evidence references
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Warrant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeploymentWarrant"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/warrants/{warrantId}/suspension:
    parameters:
      - $ref: "#/components/parameters/WarrantId"
    post:
      operationId: suspendDeploymentWarrant
      tags: [Warrants]
      summary: Suspend a warrant and stop live operation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger, rationale]
              properties:
                trigger:
                  type: string
                  enum:
                    - evidence_gap
                    - expiry
                    - code_seal_withdrawn
                    - owner_vacated
                    - machinery_of_government_change
                    - overturn_pattern
                    - valuation_missing
                rationale:
                  type: string
                effectiveAt:
                  type: string
                  format: date-time
      responses:
        "202":
          description: Suspension accepted and pushed to the operating gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeploymentWarrant"
  /v1/warrants/{warrantId}/revalidation:
    parameters:
      - $ref: "#/components/parameters/WarrantId"
    post:
      operationId: revalidateDeploymentWarrant
      tags: [Warrants]
      summary: Revalidate a warrant after an owner or department change
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountableOwner]
              properties:
                accountableOwner:
                  $ref: "#/components/schemas/AccountableOwner"
                transferredFromBuyingBodyId:
                  type: string
      responses:
        "200":
          description: Warrant revalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDeploymentWarrant"
  /v1/data-supply-agreements:
    get:
      operationId: listDataSupplyAgreements
      tags: [DataSupply]
      summary: List agreements supplying public data to suppliers
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: significant
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Agreements page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDataSupplyAgreement"
    post:
      operationId: registerDataSupplyAgreement
      tags: [DataSupply]
      summary: Register an intended public data supply agreement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSupplyAgreementCreate"
      responses:
        "201":
          description: Agreement registered, pending valuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDataSupplyAgreement"
  /v1/data-supply-agreements/{agreementId}/valuation:
    parameters:
      - $ref: "#/components/parameters/AgreementId"
    post:
      operationId: recordDataValuation
      tags: [DataSupply]
      summary: Record an evidence-based valuation of the data being supplied
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataValuationCreate"
      responses:
        "201":
          description: Valuation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDataValuation"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/data-supply-agreements/{agreementId}/external-review:
    parameters:
      - $ref: "#/components/parameters/AgreementId"
    post:
      operationId: submitAgreementForExternalReview
      tags: [DataSupply]
      summary: Refer a significant agreement for external review before signature
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerBody]
              properties:
                reviewerBody:
                  type: string
                  description: Oversight body asked to review the agreement terms
                submissionNote:
                  type: string
      responses:
        "202":
          description: Referred for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDataSupplyAgreement"
  /v1/decisions:
    post:
      operationId: recordDecision
      tags: [Decisions]
      summary: Record a decision taken or prepared by a live ai-assisted service
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRecordCreate"
      responses:
        "201":
          description: Decision recorded with an explanation artefact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDecisionRecord"
        "409":
          description: Rejected because the service holds no current warrant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/decisions/{decisionId}/explanation:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    get:
      operationId: getDecisionExplanation
      tags: [Decisions]
      summary: Retrieve the explanation as it stood when the decision was taken
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Explanation artefact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExplanationArtifact"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/redress-cases:
    get:
      operationId: listRedressCases
      tags: [Redress]
      summary: List citizen challenges against ai-assisted decisions
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: serviceId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, under_review, escalated, resolved, expired]
      responses:
        "200":
          description: Redress cases page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeRedressCase"
    post:
      operationId: openRedressCase
      tags: [Redress]
      summary: Open a time-boxed challenge through the single published route
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedressCaseCreate"
      responses:
        "201":
          description: Challenge opened with a resolution deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRedressCase"
  /v1/redress-cases/{caseId}/resolution:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: resolveRedressCase
      tags: [Redress]
      summary: Resolve a challenge and record any overturn
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, rationale]
              properties:
                outcome:
                  type: string
                  enum: [upheld_original, overturned, partially_overturned, referred_out]
                rationale:
                  type: string
                overturnReason:
                  type: string
                  enum:
                    - inadequate_explanation
                    - incorrect_input_data
                    - policy_misapplication
                    - unlawful_basis
                    - other
      responses:
        "200":
          description: Challenge resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRedressCase"
  /v1/portfolio/investments:
    get:
      operationId: listPortfolioInvestments
      tags: [Portfolio]
      summary: List speculative and prototype investments with failure tolerance
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Portfolio investments page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePortfolioInvestment"
    post:
      operationId: createPortfolioInvestment
      tags: [Portfolio]
      summary: Place a prototype inside a declared portfolio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioInvestmentCreate"
      responses:
        "201":
          description: Investment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePortfolioInvestment"
  /v1/reports/sme-access:
    get:
      operationId: getSmeAccessReport
      tags: [Reporting]
      summary: SME participation by count and by contract value
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            example: 2026-Q3
        - name: buyingBodyId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: SME access report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSmeAccessReport"
  /v1/reports/oversight-workload:
    get:
      operationId: listOversightWorkload
      tags: [Reporting]
      summary: Assurance and regulatory effort consumed by the portfolio
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Oversight workload entries page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeOversightWorkloadEntry"
  /v1/reports/annual-return:
    get:
      operationId: getAnnualReturn
      tags: [Reporting]
      summary: Stable-definition annual return with comparator benchmarking
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            example: 2026
      responses:
        "200":
          description: Annual return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAnnualReturn"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        type: string
    LotId:
      name: lotId
      in: path
      required: true
      schema:
        type: string
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
    WarrantId:
      name: warrantId
      in: path
      required: true
      schema:
        type: string
    AgreementId:
      name: agreementId
      in: path
      required: true
      schema:
        type: string
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        type: string
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: GBP
    ConsequenceGrade:
      type: string
      description: >-
        Severity of the effect of the service on an identifiable individual. The grade
        sets the explanation standard and whether a transparent-method requirement can
        be imposed by a sector regulator.
      enum: [informational, advisory, material, safety_critical]
    AccountableOwner:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          type: string
        buyingBodyId:
          type: string
        appointedAt:
          type: string
          format: date-time
    BuyingBody:
      type: object
      required: [id, name, bodyType]
      properties:
        id:
          type: string
        name:
          type: string
        bodyType:
          type: string
          enum: [ministerial_department, arms_length_body, nhs_trust, local_authority, devolved_body]
        accountingOfficer:
          type: string
        sectorRegulators:
          type: array
          items:
            type: string
    PublicChallenge:
      type: object
      required: [id, buyingBodyId, title, status, publishedAt]
      properties:
        id:
          type: string
        buyingBodyId:
          type: string
        title:
          type: string
        problemStatement:
          type: string
        affectedService:
          type: string
        anticipatedConsequenceGrade:
          $ref: "#/components/schemas/ConsequenceGrade"
        routeToMarket:
          type: string
          enum: [framework_call_off, open_tender, prototype_competition, direct_award]
        indicativeValue:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [draft, published, in_procurement, awarded, withdrawn]
        publishedAt:
          type: string
          format: date-time
        responseWindowClosesAt:
          type: string
          format: date-time
    PublicChallengeCreate:
      type: object
      required: [buyingBodyId, title, problemStatement]
      properties:
        buyingBodyId:
          type: string
        title:
          type: string
        problemStatement:
          type: string
        affectedService:
          type: string
        anticipatedConsequenceGrade:
          $ref: "#/components/schemas/ConsequenceGrade"
        routeToMarket:
          type: string
          enum: [framework_call_off, open_tender, prototype_competition, direct_award]
        indicativeValue:
          $ref: "#/components/schemas/Money"
        responseWindowClosesAt:
          type: string
          format: date-time
    SupplierProfile:
      type: object
      required: [id, name, sizeBand]
      properties:
        id:
          type: string
        name:
          type: string
        sizeBand:
          type: string
          enum: [micro, small, medium, large]
        domicile:
          type: string
        codeSealHeld:
